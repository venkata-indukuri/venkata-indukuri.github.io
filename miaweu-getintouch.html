
<!DOCTYPE html>
<html>
<head>
	<title>EU Sandbox EnhancedChat Get in Touch Pages </title>
	<div>Direct Miaw</div>
	<div><b>Web Source: GET in Touch Page</b>b></div>
	<div> MessagingSession--> Active- Inactive Handling - EndSession</div>
	<style>
		/* Hide Salesforce MIAW aria-live announcer regions — screen-reader only, not visually rendered */
		[id^="embeddedMessagingLiveRegion"] {
			position: absolute !important;
			width: 1px !important;
			height: 1px !important;
			padding: 0 !important;
			margin: -1px !important;
			overflow: hidden !important;
			clip: rect(0, 0, 0, 0) !important;
			white-space: nowrap !important;
			border: 0 !important;
		}
	</style>
</head>
<body>

	<h1> <center>EU Sandbox EnhancedChat </center></h1> 

<center>
	<select id="territorySelect" onchange="onTerritoryChange()" style="font-size:16px; padding:8px 16px; border-radius:6px; border:1px solid #ccc; margin-top:16px;">
		<option value="" disabled selected>-- Select Territory --</option>
		<option value="GB">GB - United Kingdom</option>
		<option value="IE">IE - Ireland</option>
		<option value="DE">DE - Germany</option>
		<option value="IT">IT - Italy</option>
	</select>
</center>

<!-- Issue input panel — shown after territory is selected -->
<div id="issuePanel" style="display:none; margin-top:24px; text-align:center;">
	<label for="issueInput" style="display:block; font-size:16px; font-weight:bold; margin-bottom:10px;">
		Please describe your issue:
	</label>
	<textarea
		id="issueInput"
		rows="4"
		placeholder="Type your issue here..."
		style="width:420px; max-width:90%; font-size:15px; padding:10px; border-radius:6px; border:1px solid #ccc; resize:vertical;"
		aria-label="Describe your issue"
	></textarea>
	<br/>
	<button
		id="startChatBtn"
		onclick="launchChat()"
		style="margin-top:14px; font-size:16px; padding:10px 32px; background-color:#0070d2; color:#fff; border:none; border-radius:6px; cursor:pointer;"
	>
		Start Chat
	</button>
</div>

<script type='text/javascript'>
	var territoryConfig = {
		'GB': { languageCode: 'en_US', territoryCode: 'GB' },
		'IE': { languageCode: 'en_US', territoryCode: 'IE' },
		'DE': { languageCode: 'de',    territoryCode: 'DE' },
		'IT': { languageCode: 'it',    territoryCode: 'IT' }
	};

	var chatInitialized = false;
	var userIssueMessage = '';

	function onTerritoryChange() {
		var selected = document.getElementById('territorySelect').value;
		if (!selected) return;

		if (chatInitialized) {
			sessionStorage.setItem('miaw_territory', selected);
			location.reload();
			return;
		}

		// Show the issue input panel; bootstrap is loaded only when user clicks Start Chat
		document.getElementById('issuePanel').style.display = 'block';
		document.getElementById('issueInput').value = '';
		document.getElementById('startChatBtn').disabled = false;
		document.getElementById('startChatBtn').textContent = 'Start Chat';
	}

	function launchChat() {
		var selected = document.getElementById('territorySelect').value;
		if (!selected) return;

		var message = document.getElementById('issueInput').value.trim();
		if (!message) {
			alert('Please describe your issue before starting the chat.');
			return;
		}

		userIssueMessage = message;
		sessionStorage.setItem('miaw_issue_message', userIssueMessage);

		// Disable button to prevent double-clicks
		document.getElementById('startChatBtn').disabled = true;
		document.getElementById('startChatBtn').textContent = 'Starting...';

		if (chatInitialized) {
			// Bootstrap already loaded — open chat directly
			openChat();
		} else {
			var config = territoryConfig[selected];
			loadBootstrap(config.territoryCode, config.languageCode);
		}
	}

	function openChat() {
		embeddedservice_bootstrap.utilAPI.launchChat()
			.then(function() {
				console.log('Successfully launched Messaging');
				sendMessageToChat(userIssueMessage || sessionStorage.getItem('miaw_issue_message') || '');
			})
			.catch(function() {
				console.error('Some error occurred when launching Messaging');
				document.getElementById('startChatBtn').disabled = false;
				document.getElementById('startChatBtn').textContent = 'Start Chat';
			})
			.finally(function() {
				console.log('launchChat() - finally');
			});
	}

	function sendMessageToChat(message) {
		if (!message) return;
		setTimeout(function() {
			embeddedservice_bootstrap.utilAPI.sendTextMessage(message)
				.then(function() {
					console.log('Message sent');
					sessionStorage.removeItem('miaw_issue_message');
					userIssueMessage = '';
				})
				.catch(function() {
					console.error('Message not sent');
				})
				.finally(function() {
					console.log('sendTextMessage() - finally');
				});
		}, 3000);
	}

	function loadBootstrap(territoryCode, languageCode) {
		var script = document.createElement('script');
		script.type = 'text/javascript';
		script.src = 'https://now-eu--stage.sandbox.my.site.com/ESWHelpMessagingSession1780570897423/assets/js/bootstrap.min.js';
		script.onload = function() {
			initEmbeddedMessaging(territoryCode, languageCode);
		};
		document.body.appendChild(script);
	}

	function fetchBrowserName() {
		var browserInfo = navigator.userAgent;
		if (browserInfo.includes('Opera') || browserInfo.includes('Opr')) return 'Opera';
		if (browserInfo.includes('Edg'))     return 'Edge';
		if (browserInfo.includes('Chrome'))  return 'Chrome';
		if (browserInfo.includes('Safari'))  return 'Safari';
		if (browserInfo.includes('Firefox')) return 'Firefox';
		return 'unknown';
	}

	function initEmbeddedMessaging(territoryCode, languageCode) {
		try {
			embeddedservice_bootstrap.settings.language = languageCode;

			window.addEventListener('onEmbeddedMessagingReady', function() {
				embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
					'Browser_Name'              : fetchBrowserName(),
					'Browser_Language'          : navigator.language,
					'Browser_Platform'          : navigator.platform,
					'Case_Subject'              : 'Subject: Miaw Chat',
					'Language_Code'             : languageCode,
					'Territory_Code'            : territoryCode,
					'Case_Classification'       : 'Billing Issue',
					'Case_ServiceType'          : 'TV',
					'Case_Type'                 : 'Technical Problem',
					'Contact_ID'                : '',
					'Last_Article_Viewed'       : 'https://www.nowtv.com/gb/help/article/sports-membership',
					'Logged_In_Status'          : 'false',
					'Customer_Tracking_ID'      : '234729348204982',
					'Page_URL'                  : 'https://www.nowtv.com/gb/help/article/sports-membership',
					'MarketingCloud_Visitor_ID' : '234j3453lk2343',
					'Get_In_Touch'              : 'True',
					'Case_Origin'               : 'Chat',
					'User_Agent'                : navigator.userAgent,
					'Help_Source'               : 'git-page-signedout'
				});

				// Bootstrap is ready — open chat and send the pre-typed issue message
				openChat();
			});

			embeddedservice_bootstrap.init(
				'00DAd00000CmOsM',
				'Help_Messaging_Session',
				'https://now-eu--stage.sandbox.my.site.com/ESWHelpMessagingSession1780570897423',
				{
					scrt2URL: 'https://now-eu--stage.sandbox.my.salesforce-scrt.com'
				}
			);
			chatInitialized = true;
		} catch (err) {
			console.error('Error loading Embedded Messaging: ', err);
		}
	}

	// Restore territory + issue message after reload — runs before bootstrap is loaded
	(function() {
		var savedTerritory = sessionStorage.getItem('miaw_territory');
		if (savedTerritory) {
			sessionStorage.removeItem('miaw_territory');
			document.getElementById('territorySelect').value = savedTerritory;

			// Restore the user's issue message so sendTextMessage can use it post-reload
			userIssueMessage = sessionStorage.getItem('miaw_issue_message') || '';

			var config = territoryConfig[savedTerritory];
			loadBootstrap(config.territoryCode, config.languageCode);
		}
	})();

</script>

</body>
</html>
