
<!DOCTYPE html>
<html>
<head>
	<title>DACH EnhancedChat Home - Article Pages </title>
	<div>BOT Loads on Home Page, Article Page</div>
	<div><b></b>Web Source: HomePage</b></div>
	<div> Messaging-->Active- Inactive Handling-EndSession</div>
	<style>
		/* Hide Salesforce MIAW aria-live announcer regions — screen-reader only, not visually rendered */
		[id^="embeddedMessagingLiveRegion"] {
			position: absolute !important;
			width: 1px !important;
			height: 1px !important;
			padding: 0 !important;
			margin: -1px !important;
			overflow: hidden !important;
			clip: rect(0, 0, 0, 0) !important;
			white-space: nowrap !important;
			border: 0 !important;
		}
	</style>
</head>
<body>

	<h1> <center>DACH EnhancedChat </center></h1> 
  
	
	<center>
<img src="https://www.alphatrad.co.uk/sites/alphatrad.co.uk/files/styles/news_image_amp/public/images/articles/cultural-differences-between-germany-and-austria.jpg?itok=GM9p6izU">	</center>

<center>
	<select id="territorySelect" onchange="onTerritoryChange()" style="font-size:16px; padding:8px 16px; border-radius:6px; border:1px solid #ccc; margin-top:16px;">
		<option value="" disabled selected>-- Select Territory --</option>
		<option value="DE">DE - Germany</option>
		<option value="AT">AT - Austria</option>
	</select>

	<select id="helpSourceSelect" onchange="onHelpSourceChange()" style="font-size:16px; padding:8px 16px; border-radius:6px; border:1px solid #ccc; margin-top:16px; margin-left:12px;">
		<option value="" disabled selected>-- Select Help Source --</option>
		<option value="homePage">homePage</option>
		<option value="articlePage">articlePage</option>
		<option value="refundPage">refundPage</option>
		<option value="getInTouchPageSignedIn">getInTouchPageSignedIn</option>
		<option value="getInTouchPageSignedOut">getInTouchPageSignedOut</option>
	</select>
</center>

<script type='text/javascript'>
	var territoryConfig = {
		'DE': { languageCode: 'de',    territoryCode: 'DE' },
		'AT': { languageCode: 'de',    territoryCode: 'AT' }
	};

	var chatInitialized = false;

	function onTerritoryChange() {
		var selected = document.getElementById('territorySelect').value;
		if (!selected) return;

		var helpSource = document.getElementById('helpSourceSelect').value;

		if (chatInitialized) {
			sessionStorage.setItem('miaw_territory', selected);
			sessionStorage.setItem('miaw_helpSource', helpSource || 'homePage');
			location.reload();
			return;
		}

		var config = territoryConfig[selected];
		loadBootstrap(config.territoryCode, config.languageCode, helpSource || 'homePage');
	}

	function onHelpSourceChange() {
		var helpSource = document.getElementById('helpSourceSelect').value;
		if (!helpSource) return;

		if (chatInitialized) {
			var territory = document.getElementById('territorySelect').value;
			sessionStorage.setItem('miaw_territory', territory);
			sessionStorage.setItem('miaw_helpSource', helpSource);
			location.reload();
		}
	}

	function loadBootstrap(territoryCode, languageCode, helpSource) {
		var script = document.createElement('script');
		script.type = 'text/javascript';
		script.src = 'https://ott-dach--stage.sandbox.my.site.com/ESWHelpCRMMessagingCha1778141106563/assets/js/bootstrap.min.js';
		script.onload = function() {
			initEmbeddedMessaging(territoryCode, languageCode, helpSource);
		};
		document.body.appendChild(script);
	}

	function fetchBrowserName() {
		var browserInfo = navigator.userAgent;
		if (browserInfo.includes('Opera') || browserInfo.includes('Opr')) return 'Opera';
		if (browserInfo.includes('Edg'))     return 'Edge';
		if (browserInfo.includes('Chrome'))  return 'Chrome';
		if (browserInfo.includes('Safari'))  return 'Safari';
		if (browserInfo.includes('Firefox')) return 'Firefox';
		return 'unknown';
	}

	function initEmbeddedMessaging(territoryCode, languageCode, helpSource) {
		try {
			embeddedservice_bootstrap.settings.language = languageCode;

			window.addEventListener('onEmbeddedMessagingReady', function() {
				embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
					'Browser_Name'              : fetchBrowserName(),
					'Browser_Language'          : navigator.language,
					'Browser_Platform'          : navigator.platform,
					'Case_Subject'              : 'Subject: Miaw Chat',
					'Language_Code'             : languageCode,
					'Territory_Code'            : territoryCode,
					'Case_Classification'       : 'Billing Issue',
					'Case_ServiceType'          : 'TV',
					'Case_Type'                 : 'Technical Problem',
					'Contact_ID'                : '',
					'Last_Article_Viewed'       : 'https://www.nowtv.com/gb/help/article/sports-membership',
					'Logged_In_Status'          : 'False',
					'Customer_Tracking_ID'      : '234729348204982',
					'Page_URL'                  : 'https://www.nowtv.com/gb/help/article/sports-membership',
					'MarketingCloud_Visitor_ID' : '234j3453lk2343',
					'Case_Origin'               : 'Chat',
					'User_Agent'                : navigator.userAgent,
					'Help_Source'				: helpSource
				});
			});

			embeddedservice_bootstrap.init(
				'00DS900000I8DnK',
				'Help_CRM_Messaging_Channel',
				'https://ott-dach--stage.sandbox.my.site.com/ESWHelpCRMMessagingCha1778141106563',
				{
					scrt2URL: 'https://ott-dach--stage.sandbox.my.salesforce-scrt.com'
				}
			);
			chatInitialized = true;
		} catch (err) {
			console.error('Error loading Embedded Messaging: ', err);
		}
	}

	// Restore territory and help source after reload — runs before bootstrap is loaded
	(function() {
		var savedTerritory = sessionStorage.getItem('miaw_territory');
		if (savedTerritory) {
			var savedHelpSource = sessionStorage.getItem('miaw_helpSource') || 'homePage';
			sessionStorage.removeItem('miaw_territory');
			sessionStorage.removeItem('miaw_helpSource');
			document.getElementById('territorySelect').value = savedTerritory;
			document.getElementById('helpSourceSelect').value = savedHelpSource;
			var config = territoryConfig[savedTerritory];
			loadBootstrap(config.territoryCode, config.languageCode, savedHelpSource);
		}
	})();

</script>

</body>
</html>
